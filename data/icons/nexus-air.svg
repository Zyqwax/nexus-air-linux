<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f232a"/>
      <stop offset="100%" stop-color="#0f1115"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Mouse body outline -->
  <path d="M 64 8 C 42 8 30 28 30 54 C 30 84 34 116 64 116 C 94 116 98 84 98 54 C 98 28 86 8 64 8 Z" 
        fill="url(#bodyGrad)" stroke="#2d333b" stroke-width="2.5"/>

  <!-- Left / Right Click Split Line -->
  <path d="M 64 8 L 64 48" stroke="#16181d" stroke-width="2"/>

  <!-- Honeycomb Lightweight Shell Cutouts (Nexus Air signature) -->
  <g fill="none" stroke="#252b33" stroke-width="1.2">
    <!-- Top row -->
    <polygon points="64,56 68,58 68,64 64,66 60,64 60,58" />
    <polygon points="52,56 56,58 56,64 52,66 48,64 48,58" />
    <polygon points="76,56 80,58 80,64 76,66 72,64 72,58" />
    <!-- Middle row -->
    <polygon points="58,68 62,70 62,76 58,78 54,76 54,70" />
    <polygon points="70,68 74,70 74,76 70,78 66,76 66,70" />
    <!-- Bottom row -->
    <polygon points="64,80 68,82 68,88 64,90 60,88 60,82" />
    <polygon points="52,80 56,82 56,88 52,90 48,88 48,82" />
    <polygon points="76,80 80,82 80,88 76,90 72,88 72,82" />
  </g>

  <!-- Scroll Wheel -->
  <rect x="60" y="22" width="8" height="18" rx="4" fill="#111317" stroke="#4facfe" stroke-width="1.5" />

  <!-- DPI Button -->
  <rect x="61" y="44" width="6" height="5" rx="1.5" fill="#4facfe" filter="url(#glow)" />

  <!-- Bottom RGB Glow Strip -->
  <path d="M 38 100 C 46 112 82 112 90 100" 
        fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
</svg>
